name: pulso-transmi-operate

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: pulso-transmi-operate
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      PULSO_API_URL: https://pulso-transmi.72-60-245-2.sslip.io
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,ml]'
      - name: Reconcile official API dataset into Supabase
        continue-on-error: true
        run: python scripts/reconcile_official_dataset.py
      - name: Collect released observations
        continue-on-error: true
        run: python scripts/sync_stream.py
      - name: Evaluate released predictions
        continue-on-error: true
        run: python scripts/evaluate_predictions.py
      - name: Check drift
        id: drift
        continue-on-error: true
        env:
          DRIFT_THRESHOLD: "0.20"
        run: python scripts/check_drift.py
      - name: Retrain and version on drift
        if: steps.drift.outputs.retrain == 'true'
        continue-on-error: true
        run: python scripts/train_and_version.py
      - name: Check cycle and submit predictions
        run: python -m src.pipeline
      - name: Sync cumulative leaderboard metrics to Supabase
        if: always()
        continue-on-error: true
        run: python scripts/report_leaderboard.py
