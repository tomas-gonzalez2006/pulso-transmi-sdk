name: pulso-transmi-retrain-on-low-accuracy

on:
  workflow_dispatch:
    inputs:
      training_cutoff:
        description: "UTC cutoff for a manual retraining run"
        required: false
        default: "2026-09-18T23:00:00Z"
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: pulso-transmi-retrain-on-low-accuracy
  cancel-in-progress: false

jobs:
  check-and-retrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PULSO_API_URL: https://pulso-transmi.72-60-245-2.sslip.io
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ACCURACY_RETRAIN_THRESHOLD: "75"
      RETRAIN_COOLDOWN_HOURS: "0"
      TRAINING_CUTOFF: ${{ inputs.training_cutoff }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev,ml]'
      - name: Check official accuracy threshold
        id: accuracy
        run: python scripts/check_accuracy_retrain.py
      - name: Retrain and register model
        if: steps.accuracy.outputs.retrain == 'true'
        run: python scripts/train_and_version.py
